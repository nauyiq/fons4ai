schema_version: "1.0"
handoff:
  from: fons4ai-sdd-design
  to: fons4ai-sdd-tasks
  allowed: true
feature:
  name: 向量化请求限速
  slug: embedding-request-rate-limit
  directory: spec/features/20260722
  sdd_level: S2
artifacts:
  requirements: spec/features/20260722/向量化请求限速-需求说明书.md
  design: spec/features/20260722/向量化请求限速-技术设计说明书.md
implementation_decisions:
  - 在 DynamicPgVectorStoreFactory 单例生命周期内创建并共享限速器和 EmbeddingModel 装饰器
  - 使用固定最小请求启动间隔、System.nanoTime 单调时钟和可中断等待
  - 装饰器覆盖 call(EmbeddingRequest) 与 embed(Document)，其余路径复用接口默认方法
  - 配置项为 sys.rag.vector.embedding.min-request-interval-ms，默认 0，负数快速失败
  - 不新增依赖、不新增自动重试、不修改公共业务接口、分批策略或数据库结构
acceptance_criteria:
  - AC-001
  - AC-002
  - AC-003
  - AC-004
  - AC-005
verification:
  - 使用可控时钟和等待器进行零等待、顺序间隔及并发共享的确定性单元测试
  - 验证模型异常仅委托一次且原样传播
  - 回归验证 9/9/2 分批和模型阶段失败零数据库写入
knowledge_impact:
  needed: true
  capability: rag
  note: 实现验证后由独立知识治理工作流评估同步运行链路及配置语义
