handoff:
  from: fons4ai-sdd-design
  to: fons4ai-sdd-tasks
  allowed: true
feature:
  name: RAG文档解析器扩展
  slug: rag-document-parser-extension
  directory: spec/features/20260728
  sdd_level: S2
artifacts:
  requirements: spec/features/20260728/RAG文档解析器扩展-需求说明书.md
  design: spec/features/20260728/RAG文档解析器扩展-技术设计说明书.md
implementation_decisions:
  - common 建立框架无关 DocumentSource、DocumentParseRequest、ParserSelection、Capability、泛型 DocumentParseProvider、DocumentParseResult、Registry 和 Selector
  - 泛型结果信封统一 payload 与 ParseTrace，native payload 保持框架原生对象引用，不强制经过 ParsedDocument
  - DEFAULT 固定为 native，EXPLICIT 精确选择 provider，任何失败不执行静默 fallback
  - capability 同时声明 DocumentType 和精确扩展名，MinerU 不声明 DOC、PPT、XLS 旧格式
  - MinerU 使用 JDK HttpClient，每次显式解析前调用 health，再同步 file_parse 且 response_format_zip=false，只读取 md_content
  - Spring AI 保留 DocumentReaderFacade 和旧 strategy，通过 SpringAiNativeDocumentParser 原样返回 List<Document>；仅 MinerU ParsedDocument 经过 Spring adapter
  - LangChain4j 模块不重命名，使用官方 Apache Tika parser 原样返回 native Document；仅 MinerU 结果经过 LangChain4j adapter
  - Spring AI 和 LangChain4j 使用结果类型不同的独立泛型 Registry 与明确 Bean 名，MinerU client/中立 parser 用 ConditionalOnMissingBean 共享
  - 不新增 MinerU 模块，不改动向量化、切片或持久化结构
acceptance_criteria:
  - AC-001
  - AC-002
  - AC-003
  - AC-004
  - AC-005
  - AC-006
  - AC-007
  - AC-008
  - AC-009
verification:
  - common 单元测试覆盖泛型结果 payload 引用保持、map 保留 trace、选择、注册冲突、能力矩阵、无 fallback 和可重复 source 清理
  - JDK HttpServer 契约测试覆盖 MinerU health、multipart、JSON、超限、超时、非 2xx 和非法响应
  - Spring AI 回归覆盖旧 Facade、native List/Document 原生引用与属性保持、MinerU 单次适配和 Markdown 结构保留
  - LangChain4j 测试覆盖 native 原生对象直通、MinerU 单次适配、Metadata 和标准 DocumentParser 适配
  - 双框架自动配置组合测试验证 Registry 隔离和 MinerU 共享
  - Maven reactor 构建与 common main 依赖边界扫描
data_impact:
