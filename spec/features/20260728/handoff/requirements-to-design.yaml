confirmed_facts:
  - 不新增 MinerU Starter，MinerU 作为共享文档解析 provider 由 Spring AI 和 LangChain4j 现有 RAG 模块接入
  - 使用统一解析模型、capability、registry 和 selector，V1 只支持 DEFAULT 与 EXPLICIT，不使用 LLM 自动选型
  - DEFAULT 固定使用 native，native 不支持或失败时直接报错，不自动调用 MinerU
  - 仅 EXPLICIT 指定 mineru 且 MinerU 已启用、配置完整、健康且格式支持时调用 MinerU
  - MinerU V1 使用同步 file_parse 并返回 Markdown，不处理 ZIP、图片上传或视觉模型描述
  - MinerU provider 只声明官方支持的 PDF、图片、DOCX、PPTX、XLSX，旧 DOC、PPT、XLS 不属于 MinerU capability
  - Spring AI 保持现有 DocumentReaderFacade、params 和 cleanDocument 兼容，MinerU Markdown 不进入压缩空白清洗路径
  - Spring AI 与 LangChain4j 使用独立 native 注册表，共享 MinerU 协议实现
data_impact:
  persistent_structure: none
  external_transfer: explicit-mineru-only
risks:
  - MinerU API 版本演进会影响 multipart 与 JSON 响应契约
  - 大文件会占用临时磁盘、内存和请求线程
  - 文档传输到 MinerU 需由接入方评估安全与合规
  - MinerU 使用自定义 MinerU Open Source License
knowledge_impact:
  needed: true
  description: 新增 RAG 解析 provider 模型、双框架适配边界与 MinerU 运行配置语义
