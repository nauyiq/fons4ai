# OpenAI-compatible 配置；不填写实际密钥到 Git。
# 可通过同名 -D 系统属性覆盖；密钥也支持 SUBAGENT_VERIFY_API_KEY 环境变量。
# base-url 应为 API 根地址，endpoint-path 单独指定，不要重复拼接 chat/completions。
verification.llm.base-url=
verification.llm.endpoint-path=/chat/completions
verification.llm.model=
verification.llm.api-key=

# all / native / bridge-approve / bridge-reject / bridge-reload
verification.scenario=all
# 默认使用真实 LLM；程序参数 --scripted 使用内置脚本模型，不发起网络请求。
verification.timeout-seconds=180
verification.max-iters=6
